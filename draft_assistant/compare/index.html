<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankings Comparison 2026</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <div class="brand-block">
          <p class="brand-label">Fantasy Tools</p>
          <h1>Rankings Comparison</h1>
        </div>
        <span class="season-badge" id="seasonBadge">2026</span>
        <nav class="app-nav" aria-label="App">
          <a href="/">Draft</a>
          <a href="/sleepers/">Sleepers</a>
          <a href="/teams/">Team Projections</a>
          <a href="/totals/">Total Projections</a>
          <a href="/compare/" class="active" aria-current="page">Compare</a>
        </nav>
      </div>
      <div class="header-controls">
        <label class="control">
          Position
          <select id="posFilter">
            <option value="ALL">All</option>
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
          </select>
        </label>
        <input id="searchInput" type="search" placeholder="Search players..." />
      </div>
    </header>

    <p class="compare-meta" id="metaLine">Loading…</p>

    <main class="main">
      <section class="panel rankings-panel">
        <div class="table-wrap">
          <table class="rankings-table compare-table" id="compareTable">
            <thead>
              <tr>
                <th data-sort="our_rank" class="sortable sorted-asc" data-default-dir="asc">Our #</th>
                <th data-sort="display_name" class="sortable col-player" data-default-dir="asc">Player</th>
                <th data-sort="position" class="sortable" data-default-dir="asc">Pos</th>
                <th data-sort="team" class="sortable" data-default-dir="asc">Team</th>
                <th data-sort="fantasy_pts" class="sortable num" data-default-dir="desc">PPG</th>
                <th data-sort="vorp" class="sortable num" data-default-dir="desc">VORP</th>
                <th data-sort="sentiment_score" class="sortable col-sentiment" data-default-dir="desc">Sent.</th>
                <th data-sort="ecr" class="sortable num" data-default-dir="asc">ECR</th>
                <th data-sort="adp" class="sortable num" data-default-dir="asc">ADP</th>
                <th data-sort="delta_ecr" class="sortable num" data-default-dir="asc">Δ ECR</th>
                <th data-sort="delta_adp" class="sortable num" data-default-dir="asc">Δ ADP</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="compare-foot" id="attribution">
      ECR: FantasyPros via nflverse/DynastyProcess · ADP: Fantasy Football Calculator
    </footer>
  </div>

  <div id="playerHoverCard" class="player-card player-card-hover" hidden role="tooltip"></div>

  <div id="playerModal" class="player-modal" hidden>
    <div class="player-modal-backdrop" data-close-modal></div>
    <div class="player-modal-panel" role="dialog" aria-modal="true" aria-labelledby="playerModalTitle">
      <button type="button" class="player-modal-close" data-close-modal aria-label="Close">Close</button>
      <div id="playerModalBody" class="player-card player-card-full"></div>
    </div>
  </div>

  <script src="../js/release_loader.js?v=release-bundle-1"></script>
  <script src="../js/history_table.js"></script>
  <script src="../js/sortable.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
