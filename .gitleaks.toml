# gitleaks configuration for scripts/predeploy_secret_scan.sh
#
# The predeploy gate scans the WORKING TREE (--no-git): that is what gets
# deployed, and it runs in ~2s instead of ~17s for a full history walk.
# Scanning history is an audit, not a per-deploy gate.

[extend]
useDefault = true

[allowlist]
description = """
Deliberate non-secret sentinels. tests/app asserts that these values never
appear in an HTTP response body or log line, so the literals have to be
present in the source for the tests to mean anything. Allowlisted by exact
value rather than by path, so a genuine secret committed to tests/ still fails
the scan.
"""
regexTarget = "line"
regexes = [
  '''sk-sentinel-NEVER-LEAK-[0-9]+''',
  '''sk-live-should-never-appear''',
  '''cookie-value-should-never-appear''',
  '''postgresql://fantasy:sup3r-s3cret@''',
  '''hunter2@db\.internal''',
]
