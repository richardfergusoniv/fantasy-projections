name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Cursor Cloud Agent comments arrive as cursor[bot]; without this the
          # action allows no bots and an agent's @claude mention is ignored.
          # Unlike claude-code-review.yml, this workflow sets no fixed prompt, so
          # the body of the triggering comment is the instruction Claude follows.
          allowed_bots: cursor

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Read-only tool allowlist. The action does not use the GITHUB_TOKEN this
          # job declares permissions for -- it exchanges OIDC for a GitHub App
          # installation token, and that App holds Contents and Pull Requests at
          # Read & Write. The `permissions:` block above therefore does not bound
          # what Claude can do here; this allowlist is what does.
          #
          # Granted: reply to the thread, read CI results (see additional_permissions
          # above), and read/search the repo. Bash, Write and Edit are withheld, so
          # there is no path to push a commit or call the merge API.
          #
          # This workflow sets no `prompt:`, so the triggering comment is the
          # instruction. Keep the allowlist minimal for that reason.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowedTools "mcp__github_comment__update_claude_comment,mcp__github_ci,Read,Grep,Glob"'

          # TEMPORARY DIAGNOSTIC -- see the matching note in
          # claude-code-review.yml. This workflow fails the same way (instant
          # `is_error: true`, zero cost, empty `modelUsage`), which is what
          # points at the shared CLAUDE_CODE_OAUTH_TOKEN rather than either
          # workflow's config. Remove once the failure is explained; it prints
          # prompt and tool output into the job log.
          show_full_output: true

