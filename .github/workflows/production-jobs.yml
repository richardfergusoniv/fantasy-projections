name: Production Jobs

on:
  schedule:
    # Poll every 15 minutes; run-due only executes slots inside the scheduler grace window.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-jobs
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --extra jobs

      - name: Load production job environment
        env:
          PRODUCTION_JOB_ENV: ${{ secrets.PRODUCTION_JOB_ENV }}
        run: |
          if [ -z "${PRODUCTION_JOB_ENV}" ]; then
            echo "PRODUCTION_JOB_ENV is not set on the production GitHub environment."
            echo "Run scripts/set_production_job_env_secret.ps1 locally once (see docs/GITHUB_PRODUCTION_SECRETS.md)."
            exit 1
          fi
          printf '%s\n' "${PRODUCTION_JOB_ENV}" > .env.production.local

      - name: Run due production jobs
        run: |
          set -a
          # shellcheck disable=SC1091
          source .env.production.local
          set +a
          export LONG_JOBS_EXTERNAL=false
          uv run python -m src.app.jobs.scheduler run-due
