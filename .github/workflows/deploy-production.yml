name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    # Match CI (windows-latest): sealed-bundle hash checks are sensitive to the
    # Linux checkout path and fail with players artifact drift on ubuntu runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Install gitleaks
        shell: pwsh
        run: |
          $version = '8.28.0'
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\gitleaks.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\gitleaks.zip" -DestinationPath "$env:RUNNER_TEMP\gitleaks" -Force
          "$env:RUNNER_TEMP\gitleaks" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Secret scan
        run: bash scripts/predeploy_secret_scan.sh

      - name: Run test suite
        run: uv run pytest -q

      - name: Verify MVP fixture bundle
        run: uv run python scripts/verify_mvp.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies and build
        run: |
          cd web
          npm ci
          npm test
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Migrate production database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Ensure canonical APP_PUBLIC_URL on Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANONICAL_APP_PUBLIC_URL: https://fantasy-projections-xi.vercel.app
        run: |
          set -euo pipefail
          # Public origin (not a secret). Force-overwrite so a stale
          # fantasy-projections.vercel.app value cannot keep emailing the
          # abandoned legacy host. --no-sensitive keeps it readable on pull.
          vercel env add APP_PUBLIC_URL production \
            --yes \
            --force \
            --no-sensitive \
            --value "$CANONICAL_APP_PUBLIC_URL" \
            --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          updated=$(grep -E '^APP_PUBLIC_URL=' .vercel/.env.production.local | tail -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
          echo "APP_PUBLIC_URL after upsert='${updated}'"
          if [ "$updated" != "$CANONICAL_APP_PUBLIC_URL" ]; then
            echo "Failed to set APP_PUBLIC_URL (got '${updated}')"
            exit 1
          fi

      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Post-deploy readiness check
        env:
          PRODUCTION_URL: https://fantasy-projections-xi.vercel.app
          CANONICAL_APP_PUBLIC_URL: https://fantasy-projections-xi.vercel.app
        run: |
          set -euo pipefail
          for path in /health/live /health/ready; do
            status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" "${PRODUCTION_URL}${path}")
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 from ${PRODUCTION_URL}${path}, got ${status}"
              head -c 400 /tmp/body.txt || true
              exit 1
            fi
            if grep -qi '<html' /tmp/body.txt; then
              echo "Expected JSON from ${PRODUCTION_URL}${path}, got HTML"
              exit 1
            fi
          done
          curl -sS -o /tmp/ready.json "${PRODUCTION_URL}/health/ready"
          python3 - <<'PY'
          import json, os, sys
          body = json.load(open("/tmp/ready.json"))
          checks = body.get("checks") or {}
          effective = (checks.get("effective_app_public_url") or "").rstrip("/")
          canonical = os.environ["CANONICAL_APP_PUBLIC_URL"].rstrip("/")
          print("effective_app_public_url=", effective)
          print("app_public_url=", checks.get("app_public_url"))
          print("app_public_url_remapped=", checks.get("app_public_url_remapped"))
          if effective != canonical:
              print("Magic-link origin is not canonical xi host", file=sys.stderr)
              sys.exit(1)
          PY
          curl -sS -o /tmp/home.html -w "%{http_code}" "${PRODUCTION_URL}/" | tee /tmp/home_status.txt
          if ! grep -q "Fantasy Decisions" /tmp/home.html; then
            echo "Production home page does not serve Fantasy Decisions PWA"
            exit 1
          fi
          curl -sS -o /tmp/login.html -w "%{http_code}" "${PRODUCTION_URL}/login" | tee /tmp/login_status.txt
          if grep -qi '404: NOT_FOUND' /tmp/login.html; then
            echo "Production /login returned Vercel 404"
            exit 1
          fi
          # Legacy abandoned host must remain a different product (not our PWA).
          legacy=$(curl -sS -o /tmp/legacy.html -w "%{http_code}" "https://fantasy-projections.vercel.app/" || true)
          if [ "$legacy" = "200" ] && grep -q "Fantasy Decisions" /tmp/legacy.html; then
            echo "Unexpected: abandoned host now serves Fantasy Decisions"
            exit 1
          fi
          if [ "$legacy" = "200" ] && grep -qi "Fantasy Projections" /tmp/legacy.html; then
            echo "Confirmed abandoned host still serves legacy Fantasy Projections"
          fi
