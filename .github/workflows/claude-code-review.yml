name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Read-only exploration plus both output channels.
          #
          # The generated default allowed only create_inline_comment, which left
          # the reviewer unable to open a single file (no Read/Grep/Glob) and with
          # no way to say anything that is not pinned to a diff line. Runs finished
          # green having posted nothing -- see PR #70 (3 turns, 1 permission denial,
          # no output) and PR #71. A research PR that is mostly a new document is
          # the worst case: nothing to anchor an inline comment to, so silence.
          #
          # update_claude_comment gives it a summary channel. In agent mode (this
          # workflow sets `prompt:`) the github_comment MCP server is only
          # installed when the allowlist names it, so listing it is what enables it.
          #
          # Bash, Write and Edit stay withheld: no path to push a commit or merge.
          # github_ci is deliberately absent -- that server also needs a workflow
          # token this job does not grant.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Read,Grep,Glob"'
          # Cursor Cloud Agent pushes trigger this workflow as cursor[bot].
          # Without this, claude-code-action fails the check on those updates.
          allowed_bots: cursor

