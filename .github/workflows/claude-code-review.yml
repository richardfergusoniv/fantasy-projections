name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record review gate start
        id: gate
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin skill still does the review. Trailing overrides exist
          # because step 1 of code-review.md will otherwise stop without
          # posting on ready PRs it judges "trivial" (PR #80: 2 turns, 0
          # denials, no comment) and because headless Actions cannot wait
          # on background Agent + ScheduleWakeup (anthropics/claude-code#76255).
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Repo override for this GitHub Actions run (takes precedence over the skill's step-1 silent stop). Head commit: ${{ github.event.pull_request.head.sha }}

            - This job is a visible review check. GitHub Actions is one-shot / headless: do not launch background agents that wait on ScheduleWakeup; do the work inline.
            - Draft pull requests are reviewed here like any other. Cursor Cloud Agent opens nearly every PR as a draft, so skipping drafts silences most of the repo.
            - You MUST leave a visible GitHub comment before exiting, draft or not. Use `gh pr comment` for a summary (including tooling-only, docs, config, and "no issues" diffs) and/or `mcp__github_inline_comment__create_inline_comment` for line notes.
            - Do not stop after the eligibility check without posting. Do not skip a PR as "draft", "trivial" or "already commented". If Claude already commented, post a short SHA-stamped follow-up for this head commit.
          # Read/search plus the two posting channels the code-review plugin
          # actually uses. Unrestricted Bash, Write and Edit stay withheld:
          # no path to push a commit or call the merge API.
          #
          # Why this allowlist (PR #79) plus the fail-closed step (PR silent-
          # green v2 / #80):
          #
          # The plugin posts a top-level summary with `gh pr comment` and
          # line notes with `create_inline_comment` (confirmed: true).
          # `update_claude_comment` cannot create that summary: in agent
          # mode (this workflow sets `prompt:`) CLAUDE_COMMENT_ID is unset,
          # so the MCP tool errors.
          #
          # Job `pull-requests: write` matches the action's auto-review
          # example. The Claude GitHub App token from OIDC already has
          # write (inline comments on #76 posted as claude[bot] under
          # read-only GITHUB_TOKEN perms); the job scope matters if a
          # future run falls back to the workflow token, and it is the
          # documented minimum for `gh pr comment`.
          #
          # Allowing gh pr comment is necessary but not sufficient. On
          # ready PR #80 the plugin still exited success after 2 turns /
          # 0 denials / "No buffered inline comments" and posted nothing.
          # The code-review skill's step 1 stops when it judges the PR
          # draft, already commented, or "trivial". The prompt override
          # above countermands all three: every PR must speak, and the
          # step below fails the job if claude[bot] left no visible
          # comment or review.
          #
          # Drafts are NOT exempt. Cursor Cloud Agent opens nearly every
          # PR as a draft (#64, #70, #71, #78), so exempting drafts
          # silenced most of the repo while the check stayed green.
          #
          # github_ci is deliberately absent -- that server also needs a
          # workflow token this job does not grant. Agent/Task stay
          # withheld so the skill cannot stall on ScheduleWakeup in
          # headless mode.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"'
          # Cursor Cloud Agent pushes trigger this workflow as cursor[bot].
          # Without this, claude-code-action fails the check on those updates.
          allowed_bots: cursor
          # TEMPORARY DIAGNOSTIC -- remove once the current failures are
          # explained. Every run since 2026-09-16T23:18Z ends in
          # `is_error: true` after ~420ms with `num_turns: 1`,
          # `total_cost_usd: 0` and an empty `modelUsage` -- the SDK aborts
          # before a single model request. The same happens in claude.yml,
          # which shares nothing with this workflow but the
          # CLAUDE_CODE_OAUTH_TOKEN secret, so the cause is that credential
          # (exhausted quota or an expired/revoked token), not this config.
          # The action masks the SDK's message behind "full output hidden for
          # security", so the reason is unreadable. This surfaces it.
          # Turning this on prints prompt and tool output into the job log:
          # revert it as soon as one failing run has been read.
          show_full_output: true

      - name: Fail closed if Claude posted nothing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --draft is deliberately not passed (it defaults to false), so the
        # gate enforces on drafts too. Passing the real draft flag made the
        # script return skip_draft and let silent runs stay green on exactly
        # the PRs Cursor opens.
        run: |
          python3 scripts/assert_claude_review_posted.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --since "${{ steps.gate.outputs.started_at }}"
